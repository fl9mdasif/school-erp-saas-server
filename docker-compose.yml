# Local development and single-VPS deployment.
#   docker compose up -d --build
# MongoDB runs as a one-node replica set because transactions require one.
services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: >
        mongosh --quiet --eval
        "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  api:
    build: .
    depends_on:
      mongo:
        condition: service_healthy
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "5000"
      DATABASE_URL: mongodb://mongo:27017/school_management?replicaSet=rs0
    ports:
      - "5000:5000"
    restart: unless-stopped

  # HTTPS reverse proxy for the VPS. Remove this service for local development.
  caddy:
    image: caddy:2
    profiles: ["proxy"]
    depends_on: [api]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  mongo-data:
  caddy-data:
  caddy-config:
